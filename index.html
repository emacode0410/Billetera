<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rifa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Rifa - Grilla 00 al 99</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --available: #1e293b;
    --available-border: #475569;
    --sold: #16a34a;
    --sold-text: #ecfdf5;
    --reserved: #ec4899;
    --reserved-hover: #db2777;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --gold: #f59e0b;
    --gold-hover: #d97706;
    --teal: #14b8a6;
    --teal-hover: #0d9488;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px 0;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .toolbar {
    max-width: 720px;
    margin: 0 auto 16px auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }
  .toolbar input[type="text"], .toolbar input[type="number"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .toolbar label {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stats {
    max-width: 720px;
    margin: 0 auto 16px auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 3px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    text-align: center;
    min-width: 90px;
  }
  .stat-card.stat-sold { border-top-color: var(--sold); }
  .stat-card.stat-sold .value { color: var(--sold); }
  .stat-card.stat-available { border-top-color: var(--teal); }
  .stat-card.stat-available .value { color: var(--teal); }
  .stat-card.stat-total { border-top-color: var(--gold); }
  .stat-card.stat-total .value { color: var(--gold); }
  .stat-card.stat-reserved { border-top-color: var(--reserved); }
  .stat-card.stat-reserved .value { color: var(--reserved); }
  .stat-card .value {
    font-size: 1.2rem;
    font-weight: 700;
  }
  .stat-card .label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .grid {
    max-width: 640px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
  }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--available);
    border: 1px solid var(--available-border);
    border-radius: 8px;
    font-weight: 700;
    font-size: clamp(0.7rem, 2.6vw, 1rem);
    cursor: pointer;
    user-select: none;
    transition: transform 0.05s ease, border-color 0.15s ease;
    color: var(--text);
  }
  .cell:active {
    transform: scale(0.93);
  }
  .cell .cell-num {
    position: relative;
    z-index: 1;
  }
  .cell .sold-badge, .cell .reserved-badge {
    display: none;
  }
  .cell.sold {
    border-color: var(--sold);
    border-width: 2px;
  }
  .cell.reserved {
    border-color: var(--reserved);
    border-width: 2px;
  }
  .cell.sold .sold-badge, .cell.reserved .reserved-badge {
    display: block;
    position: absolute;
    top: 1px;
    right: 1px;
    width: 46%;
    height: 46%;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5));
  }
  .cell.match {
    outline: 3px solid #f59e0b;
    outline-offset: -3px;
  }
  .cell.dimmed {
    opacity: 0.25;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--accent);
    color: white;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: var(--border); }
  button.secondary.accent-gold { border-color: var(--gold); color: var(--gold); }
  button.secondary.accent-gold:hover { background: rgba(245,158,11,0.15); }
  button.secondary.accent-teal { border-color: var(--teal); color: var(--teal); }
  button.secondary.accent-teal:hover { background: rgba(20,184,166,0.15); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: var(--danger-hover); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 360px;
  }
  .modal h2 {
    margin: 0 0 4px 0;
    font-size: 1.4rem;
  }
  .modal .modal-sub {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 16px;
  }
  .field {
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .modal-actions button { flex: 1; }
  .status-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .status-option {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .status-option.active[data-status="sold"] {
    background: var(--sold);
    border-color: var(--sold);
    color: #ffffff;
  }
  .status-option.active[data-status="reserved"] {
    background: var(--reserved);
    border-color: var(--reserved);
    color: #ffffff;
  }
  .footer-actions {
    max-width: 720px;
    margin: 24px auto 0 auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend {
    max-width: 640px;
    margin: 12px auto 0 auto;
    display: flex;
    gap: 16px;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 4px;
    display: inline-block;
  }
  .swatch.available { background: var(--available); border: 1px solid var(--available-border); }
  .legend-paddle {
    width: 16px;
    height: 16px;
  }
  #raffleTitle {
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--border);
    color: var(--text);
    text-align: center;
    font-size: 1.3rem;
    font-weight: 700;
    width: 100%;
    max-width: 400px;
    display: block;
    margin: 0 auto;
    padding-bottom: 4px;
  }
  #raffleTitle:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  .hidden { display: none !important; }
  .backup-banner {
    max-width: 640px;
    margin: 0 auto 16px auto;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--gold);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: space-between;
    font-size: 0.8rem;
  }
  .backup-banner p {
    margin: 0;
    color: var(--text);
    flex: 1;
    min-width: 180px;
  }
  .backup-banner .backup-banner-actions {
    display: flex;
    gap: 8px;
  }
  .backup-banner button {
    padding: 6px 10px;
    font-size: 0.78rem;
  }
  .product-section {
    max-width: 640px;
    margin: 0 auto 16px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .product-images {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .product-thumb {
    position: relative;
    width: 110px;
    height: 110px;
  }
  .product-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    display: block;
  }
  .product-thumb .thumb-remove {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    padding: 0;
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .product-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .product-hint {
    font-size: 0.72rem;
    color: var(--muted);
  }
  .sponsors {
    max-width: 640px;
    margin: 24px auto 0 auto;
    text-align: center;
  }
  .ig-contact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    font-weight: 700;
    font-size: 1rem;
    color: var(--text);
  }
  .ig-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }
  .sponsors-label {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .sponsors-logos {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .sponsor-logo {
    max-height: 68px;
    max-width: 180px;
    object-fit: contain;
    border-radius: 8px;
    background: #ffffff;
    padding: 8px 12px;
  }
</style>
</head>
<body>

<input id="raffleTitle" type="text" value="Mi Rifa" spellcheck="false">
<div class="subtitle">Toca un número para marcarlo como vendido</div>

<div class="backup-banner hidden" id="backupBanner">
  <p>Recordá exportar un backup para no perder tus datos.</p>
  <div class="backup-banner-actions">
    <button id="backupBannerExport">Exportar ahora</button>
    <button class="secondary" id="backupBannerDismiss">Ahora no</button>
  </div>
</div>

<div class="product-section">
  <div class="product-images" id="productImages"></div>
  <div class="product-actions">
    <button class="secondary" id="imageBtn">Agregar imagen del premio</button>
    <span class="product-hint" id="imageHint">Hasta 3 imágenes, opcional</span>
  </div>
  <input type="file" id="imageInput" accept="image/*" style="display:none">
</div>

<div class="toolbar">
  <input id="searchBox" type="text" placeholder="Buscar por nombre, número o referencia...">
  <label>Precio por número: $ <input id="priceInput" type="number" min="0" step="1" style="width:80px"></label>
  <label>Alias transferencia: <input id="aliasInput" type="text" placeholder="opcional" style="width:140px"></label>
</div>

<div class="stats">
  <div class="stat-card stat-sold"><div class="value" id="statSold">0</div><div class="label">Vendidos</div></div>
  <div class="stat-card stat-reserved"><div class="value" id="statReserved">0</div><div class="label">Reservados</div></div>
  <div class="stat-card stat-available"><div class="value" id="statAvailable">100</div><div class="label">Disponibles</div></div>
  <div class="stat-card stat-total"><div class="value" id="statTotal">$0</div><div class="label">Recaudado</div></div>
</div>

<div class="grid" id="grid"></div>

<div class="legend">
  <span><span class="swatch available"></span> Disponible</span>
  <span><svg class="legend-paddle" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#d7e600" stroke="#6b7a00" stroke-width="1.4"/><path d="M7 4.5 C11 9 11 15 7 19.5" stroke="#6b7a00" stroke-width="1.2" fill="none"/><path d="M17 4.5 C13 9 13 15 17 19.5" stroke="#6b7a00" stroke-width="1.2" fill="none"/></svg> Vendido</span>
  <span><svg class="legend-paddle" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#f472b6" stroke="#9d174d" stroke-width="1.4"/><path d="M7 4.5 C11 9 11 15 7 19.5" stroke="#9d174d" stroke-width="1.2" fill="none"/><path d="M17 4.5 C13 9 13 15 17 19.5" stroke="#9d174d" stroke-width="1.2" fill="none"/></svg> Reservado</span>
</div>

<div class="footer-actions">
  <button class="secondary accent-gold" id="downloadImageBtn">Descargar imagen (PNG)</button>
  <button class="secondary accent-teal" id="exportBtn">Exportar backup</button>
  <button class="secondary accent-teal" id="importBtn">Importar backup</button>
  <button class="danger" id="resetBtn">Reiniciar todo</button>
</div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<div class="sponsors">
  <div class="ig-contact">
    <svg class="ig-icon" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="igGradApp" x1="0" y1="24" x2="24" y2="0">
          <stop offset="0%" stop-color="#feda75"/>
          <stop offset="30%" stop-color="#fa7e1e"/>
          <stop offset="60%" stop-color="#d62976"/>
          <stop offset="100%" stop-color="#962fbf"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="url(#igGradApp)" stroke-width="2"/>
      <circle cx="12" cy="12" r="5" fill="none" stroke="url(#igGradApp)" stroke-width="2"/>
      <circle cx="17.5" cy="6.5" r="1.2" fill="url(#igGradApp)"/>
    </svg>
    <span>@codeluppi.padel</span>
  </div>
  <div class="sponsors-label">Auspician</div>
  <div class="sponsors-logos">
    <img class="sponsor-logo" id="sponsorFemak" alt="Femak">
    <img class="sponsor-logo" id="sponsorZp" alt="ZP">
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h2 id="modalNumber">00</h2>
    <div class="modal-sub" id="modalSub">Cargar datos del comprador</div>

    <div class="status-toggle">
      <button type="button" class="status-option" id="statusSold" data-status="sold">Vendido</button>
      <button type="button" class="status-option" id="statusReserved" data-status="reserved">Reservado</button>
    </div>

    <div class="field">
      <label for="buyerName">Nombre del comprador</label>
      <input id="buyerName" type="text" placeholder="Ej: Juan Pérez">
    </div>
    <div class="field">
      <label for="buyerRef">Referencia (celular o Instagram)</label>
      <input id="buyerRef" type="text" placeholder="Ej: 099123456 o @juanperez">
    </div>

    <div class="modal-actions">
      <button class="secondary" id="cancelBtn">Cancelar</button>
      <button class="danger" id="clearBtn">Quitar</button>
      <button id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

  let data = loadData();
  let currentNumber = null;
  let productImageList = loadImagesList();

  function loadImagesList() {
    try {
      const raw = localStorage.getItem(IMAGES_KEY);
      if (raw) return JSON.parse(raw);
      const legacy = localStorage.getItem(IMAGE_KEY);
      if (legacy) {
        localStorage.setItem(IMAGES_KEY, JSON.stringify([legacy]));
        localStorage.removeItem(IMAGE_KEY);
        return [legacy];
      }
      return [];
    } catch (e) {
      return [];
    }
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function pad(n) {
    return n.toString().padStart(2, '0');
  }

  function buildGrid() {
    grid.innerHTML = '';
    for (let i = 0; i <= 99; i++) {
      const num = pad(i);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.number = num;
      cell.innerHTML = '<span class="cell-num">' + num + '</span>' + BALL_SVG + RESERVED_BALL_SVG;
      cell.addEventListener('click', () => openModal(num));
      grid.appendChild(cell);
    }
  }

  function renderGrid() {
    const cells = grid.querySelectorAll('.cell');
    const query = searchBox.value.trim().toLowerCase();
    cells.forEach(cell => {
      const num = cell.dataset.number;
      const entry = data[num];
      const isReserved = !!entry && entry.status === 'reserved';
      const isSold = !!entry && !isReserved;
      cell.classList.toggle('sold', isSold);
      cell.classList.toggle('reserved', isReserved);

      if (query) {
        const matches = num.includes(query) ||
          (entry && ((entry.name || '').toLowerCase().includes(query) ||
                     (entry.ref || '').toLowerCase().includes(query)));
        cell.classList.toggle('match', !!matches);
        cell.classList.toggle('dimmed', !matches);
      } else {
        cell.classList.remove('match', 'dimmed');
      }
    });
    updateStats();
  }

  function updateStats() {
    const entries = Object.values(data);
    const reservedCount = entries.filter(e => e.status === 'reserved').length;
    const soldCount = entries.length - reservedCount;
    const price = parseFloat(priceInput.value) || 0;
    statSold.textContent = soldCount;
    statReserved.textContent = reservedCount;
    statAvailable.textContent = 100 - soldCount - reservedCount;
    statTotal.textContent = '$' + (soldCount * price).toLocaleString('es-UY');
    updateBackupBanner(soldCount + reservedCount);
  }

  function updateBackupBanner(soldCount) {
    if (soldCount === 0) {
      backupBanner.classList.add('hidden');
      return;
    }
    const lastBackup = parseInt(localStorage.getItem(LAST_BACKUP_KEY) || '0', 10);
    const snoozeUntil = parseInt(localStorage.getItem(BACKUP_SNOOZE_KEY) || '0', 10);
    const now = Date.now();
    const dayMs = 24 * 60 * 60 * 1000;
    const needsBackup = (now - lastBackup) > dayMs;
    const snoozed = now < snoozeUntil;
    backupBanner.classList.toggle('hidden', !(needsBackup && !snoozed));
  }

  let selectedStatus = 'sold';

  function setSelectedStatus(status) {
    selectedStatus = status;
    statusSoldBtn.classList.toggle('active', status === 'sold');
    statusReservedBtn.classList.toggle('active', status === 'reserved');
  }

  statusSoldBtn.addEventListener('click', () => setSelectedStatus('sold'));
  statusReservedBtn.addEventListener('click', () => setSelectedStatus('reserved'));

  function openModal(num) {
    currentNumber = num;
    const entry = data[num];
    modalNumber.textContent = num;
    modalSub.textContent = entry ? 'Editar datos del comprador' : 'Cargar datos del comprador';
    buyerName.value = entry ? entry.name || '' : '';
    buyerRef.value = entry ? entry.ref || '' : '';
    setSelectedStatus(entry && entry.status === 'reserved' ? 'reserved' : 'sold');
    clearBtn.style.display = entry ? 'block' : 'none';
    overlay.classList.remove('hidden');
    setTimeout(() => buyerName.focus(), 50);
  }

  function closeModal() {
    overlay.classList.add('hidden');
    currentNumber = null;
  }

  saveBtn.addEventListener('click', () => {
    if (currentNumber === null) return;
    const name = buyerName.value.trim();
    const ref = buyerRef.value.trim();
    if (!name) {
      buyerName.focus();
      return;
    }
    data[currentNumber] = { name, ref, status: selectedStatus };
    saveData();
    renderGrid();
    closeModal();
  });

  clearBtn.addEventListener('click', () => {
    if (currentNumber === null) return;
    if (confirm('¿Quitar la venta del número ' + currentNumber + '?')) {
      delete data[currentNumber];
      saveData();
      renderGrid();
      closeModal();
    }
  });

  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closeModal();
  });

  searchBox.addEventListener('input', renderGrid);

  priceInput.addEventListener('input', () => {

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBall(ctx, x, y, size, color) {
    const cx = x + size / 2;
    const cy = y + size / 2;
    const r = size / 2 - size * 0.03;
    ctx.fillStyle = color;
    ctx.strokeStyle = '#6b7a00';
    ctx.lineWidth = Math.max(1, size * 0.06);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.lineWidth = Math.max(1, size * 0.05);
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.55, cy - r * 0.9);
    ctx.quadraticCurveTo(cx + r * 0.35, cy, cx - r * 0.55, cy + r * 0.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.55, cy - r * 0.9);
    ctx.quadraticCurveTo(cx - r * 0.35, cy, cx + r * 0.55, cy + r * 0.9);
    ctx.stroke();
  }

  function drawInstagramIcon(ctx, x, y, size) {
    const grad = ctx.createLinearGradient(x, y + size, x + size, y);
    grad.addColorStop(0, '#feda75');
    grad.addColorStop(0.3, '#fa7e1e');
    grad.addColorStop(0.6, '#d62976');
    grad.addColorStop(1, '#962fbf');
    const lw = size * 0.09;
    ctx.strokeStyle = grad;
    ctx.lineWidth = lw;
    roundRectPath(ctx, x + lw / 2, y + lw / 2, size - lw, size - lw, size * 0.28);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + size / 2, y + size / 2, size * 0.22, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x + size * 0.74, y + size * 0.24, size * 0.07, 0, Math.PI * 2);
    ctx.fill();
  }

  function loadImageEl(src) {
    return new Promise((resolve) => {
      if (!src) { resolve(null); return; }
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  function buildPosterCanvas() {
    const width = 900;
    const padding = 36;
    const gap = 6;
    const cols = 10;
    const cellSize = Math.floor((width - padding * 2 - gap * (cols - 1)) / cols);
    const gridSize = cellSize * cols + gap * (cols - 1);
    const gridX = Math.round((width - gridSize) / 2);

    const title = raffleTitle.value.trim() || 'Rifa';
    const tagline = '¡Participá y ganá grandes premios!';
    const alias = aliasInput.value.trim();
    const price = parseFloat(priceInput.value) || 0;
    const titleFontSize = 40;
    const titleHeight = titleFontSize + 10;
    const taglineFontSize = 20;
    const taglineHeight = taglineFontSize + 38;

    return Promise.all([
      Promise.all(productImageList.map(loadImageEl)),
      loadImageEl(FEMAK_LOGO),
      loadImageEl(ZP_LOGO)
    ]).then(([prodImgsRaw, femakImg, zpImg]) => {
      const prodImgs = prodImgsRaw.filter(Boolean);

      const slotH = 200;
      const gapImg = 14;
      let imgDraws = [];
      let imgBoxHeight = 0;
      if (prodImgs.length) {
        const maxRowW = width - padding * 2;
        const slotW = Math.min(240, (maxRowW - gapImg * (prodImgs.length - 1)) / prodImgs.length);
        const totalW = slotW * prodImgs.length + gapImg * (prodImgs.length - 1);
        const startX = (width - totalW) / 2;
        prodImgs.forEach((img, idx) => {
          const ratio = Math.min(slotW / img.width, slotH / img.height, 1);
          const w = Math.round(img.width * ratio);
          const h = Math.round(img.height * ratio);
          const x = Math.round(startX + idx * (slotW + gapImg) + (slotW - w) / 2);
          const yOff = Math.round((slotH - h) / 2);
          imgDraws.push({ img, x, w, h, yOff });
        });
        imgBoxHeight = slotH + 26;
      }

      const legendHeight = 40;
      const priceHeight = price > 0 ? 34 : 0;
      const aliasHeight = alias ? 34 : 0;
      const warningHeight = 56;
      const igHeight = 46;
      const sponsorsHeight = (femakImg || zpImg) ? 100 : 0;

      const height = padding + titleHeight + taglineHeight + imgBoxHeight + gridSize +
        legendHeight + priceHeight + aliasHeight + warningHeight + igHeight + sponsorsHeight + padding;

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#3d78b5');
      bgGrad.addColorStop(0.14, '#12294d');
      bgGrad.addColorStop(0.4, '#0b1c33');
      bgGrad.addColorStop(1, '#04070d');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      let y = padding;

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold ' + titleFontSize + 'px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(title, width / 2, y);
      y += titleHeight;

      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold ' + taglineFontSize + 'px Arial, sans-serif';
      ctx.fillText(tagline, width / 2, y);
      y += taglineHeight;

      if (imgDraws.length) {
        imgDraws.forEach(d => {
          const dy = y + d.yOff;
          ctx.save();
          roundRectPath(ctx, d.x, dy, d.w, d.h, 10);
          ctx.clip();
          ctx.drawImage(d.img, d.x, dy, d.w, d.h);
          ctx.restore();
          ctx.strokeStyle = '#f1f5f9';
          ctx.lineWidth = 2;
          roundRectPath(ctx, d.x, dy, d.w, d.h, 10);
          ctx.stroke();
        });
        y += imgBoxHeight;
      }

      for (let i = 0; i <= 99; i++) {
        const num = pad(i);
        const row = Math.floor(i / cols);
        const col = i % cols;
        const cx = gridX + col * (cellSize + gap);
        const cy = y + row * (cellSize + gap);
        const entry = data[num];
        const isReserved = !!entry && entry.status === 'reserved';
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = entry ? (isReserved ? '#ec4899' : '#16a34a') : '#000000';
        ctx.lineWidth = entry ? 2.5 : 1.5;
        roundRectPath(ctx, cx, cy, cellSize, cellSize, 6);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#111111';
        ctx.font = 'bold ' + Math.round(cellSize * 0.34) + 'px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(num, cx + cellSize / 2, cy + cellSize / 2 + 1);
        if (entry) {
          const badgeSize = cellSize * 0.5;
          drawBall(ctx, cx + cellSize - badgeSize - 1, cy + 1, badgeSize, isReserved ? '#f472b6' : '#d7e600');
        }
      }
      y += gridSize + 20;

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '16px Arial, sans-serif';
      let lx = gridX;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1.5;
      roundRectPath(ctx, lx, y - 8, 16, 16, 4);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#f1f5f9';
      ctx.fillText('Disponible', lx + 24, y);
      lx += 130;
      drawBall(ctx, lx, y - 10, 20, '#d7e600');
      ctx.fillStyle = '#f1f5f9';
      ctx.fillText('Vendido', lx + 24, y);
      lx += 110;
      drawBall(ctx, lx, y - 10, 20, '#f472b6');
      ctx.fillStyle = '#f1f5f9';
      ctx.fillText('Reservado', lx + 24, y);
      y += legendHeight;

      if (price > 0) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 18px Arial, sans-serif';
        ctx.fillStyle = '#f1f5f9';
        ctx.fillText('Precio por número: $' + price.toLocaleString('es-UY'), width / 2, y);
        y += priceHeight;
      }

      if (alias) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 18px Arial, sans-serif';
        ctx.fillStyle = '#f1f5f9';
        ctx.fillText('Alias para transferencias: ' + alias, width / 2, y);
        y += aliasHeight;
      }

      const boxH = warningHeight - 12;
      roundRectPath(ctx, padding, y, width - padding * 2, boxH, 10);
      ctx.fillStyle = '#fef3c7';
      ctx.fill();
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#92400e';
      ctx.font = 'bold 15px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚠ IMPORTANTE: antes de transferir, consultá que el número esté disponible', width / 2, y + boxH / 2);
      y += warningHeight;

      {
        const igIconSize = 26;
        const igText = '@codeluppi.padel';
        ctx.font = 'bold 18px Arial, sans-serif';
        const igTextWidth = ctx.measureText(igText).width;
        const igTotalWidth = igIconSize + 8 + igTextWidth;
        const igStartX = (width - igTotalWidth) / 2;
        const igCenterY = y + igHeight / 2;
        drawInstagramIcon(ctx, igStartX, igCenterY - igIconSize / 2, igIconSize);
        ctx.fillStyle = '#f1f5f9';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(igText, igStartX + igIconSize + 8, igCenterY);
        y += igHeight;
      }

      if (femakImg || zpImg) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = '12px Arial, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('AUSPICIAN', width / 2, y);
        y += 22;
        const logos = [femakImg, zpImg].filter(Boolean);
        const logoH = 70;
        const gapLogo = 34;
        const widths = logos.map(im => logoH * (im.width / im.height));
        const totalW = widths.reduce((a, b) => a + b, 0) + gapLogo * (logos.length - 1);
        let sx = (width - totalW) / 2;
        logos.forEach((im, idx) => {
          const w = widths[idx];
          ctx.drawImage(im, sx, y, w, logoH);
          sx += w + gapLogo;
        });
      }

      ctx.strokeStyle = '#3d78b5';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, width - 6, height - 6);

      return canvas;
    });
  }

  imageBtn.addEventListener('click', () => imageInput.click());

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (productImageList.length >= MAX_IMAGES) {
      imageInput.value = '';
      return;
    }
    resizeImage(file, 1000, 0.85).then(dataUrl => {
      try {
        productImageList.push(dataUrl);
        localStorage.setItem(IMAGES_KEY, JSON.stringify(productImageList));
        renderProductImages();
      } catch (err) {
        alert('No se pudo guardar la imagen (puede ser demasiado pesada). Probá con otra foto.');
      }
    }).catch(() => {
      alert('No se pudo procesar la imagen. Probá con otro archivo.');
    });
    imageInput.value = '';
  });

  function renderProductImages() {
    productImages.innerHTML = '';
    productImageList.forEach((dataUrl, index) => {
      const thumb = document.createElement('div');
      thumb.className = 'product-thumb';
      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = 'Imagen del premio';
      const removeBtn = document.createElement('button');
      removeBtn.className = 'danger thumb-remove';
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', () => {
        if (confirm('¿Quitar esta imagen?')) {
          productImageList.splice(index, 1);
          localStorage.setItem(IMAGES_KEY, JSON.stringify(productImageList));
          renderProductImages();
        }
      });
      thumb.appendChild(img);
      thumb.appendChild(removeBtn);
      productImages.appendChild(thumb);
    });
    const atMax = productImageList.length >= MAX_IMAGES;
    imageBtn.classList.toggle('hidden', atMax);
    imageHint.textContent = atMax
      ? 'Máximo ' + MAX_IMAGES + ' imágenes'
      : 'Hasta ' + MAX_IMAGES + ' imágenes, opcional';
  }

  function resizeImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxSize) {
            height = Math.round(height * (maxSize / width));
            width = maxSize;
          } else if (height > maxSize) {
            width = Math.round(width * (maxSize / height));
            height = maxSize;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function exportBackup() {
    const backup = {
      title: raffleTitle.value,
      price: priceInput.value,
      alias: aliasInput.value,
      images: productImageList,
      data: data,
      exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rifa-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    localStorage.setItem(LAST_BACKUP_KEY, String(Date.now()));
    updateBackupBanner(Object.keys(data).length);
  }

  exportBtn.addEventListener('click', exportBackup);

  backupBannerExport.addEventListener('click', exportBackup);

  backupBannerDismiss.addEventListener('click', () => {
    localStorage.setItem(BACKUP_SNOOZE_KEY, String(Date.now() + 12 * 60 * 60 * 1000));
    backupBanner.classList.add('hidden');
  });

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const backup = JSON.parse(reader.result);
        if (backup.data) {
          data = backup.data;
          saveData();
        }
        if (backup.title) {
          raffleTitle.value = backup.title;
          localStorage.setItem(TITLE_KEY, backup.title);
        }
        if (backup.price !== undefined) {
          priceInput.value = backup.price;
          localStorage.setItem(PRICE_KEY, backup.price);
        }
        if (backup.alias !== undefined) {
          aliasInput.value = backup.alias;
          localStorage.setItem(ALIAS_KEY, backup.alias);
        }
        if (Array.isArray(backup.images)) {
          productImageList = backup.images.slice(0, MAX_IMAGES);
          localStorage.setItem(IMAGES_KEY, JSON.stringify(productImageList));
          renderProductImages();
        } else if (backup.image) {
          productImageList = [backup.image];
          localStorage.setItem(IMAGES_KEY, JSON.stringify(productImageList));
          renderProductImages();
        }
        renderGrid();
        alert('Backup importado correctamente.');
      } catch (err) {
        alert('El archivo no es un backup válido.');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  resetBtn.addEventListener('click', () => {
    if (confirm('Esto borrará TODAS las ventas cargadas. ¿Seguro que querés continuar?')) {
      data = {};
      saveData();
      renderGrid();
    }
  });

  function init() {
    const savedTitle = localStorage.getItem(TITLE_KEY);
    if (savedTitle) raffleTitle.value = savedTitle;
    const savedPrice = localStorage.getItem(PRICE_KEY);
    if (savedPrice) priceInput.value = savedPrice;
    const savedAlias = localStorage.getItem(ALIAS_KEY);
    if (savedAlias) aliasInput.value = savedAlias;
    sponsorFemak.src = FEMAK_LOGO;
    sponsorZp.src = ZP_LOGO;
    renderProductImages();
    buildGrid();
    renderGrid();
  }

  init();
})();
</script>
